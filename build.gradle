plugins {
    id 'java'
}

group 'org.ifad.portal.httpsclienttest'
version '1.0'

repositories {
    mavenCentral()
}

def javaTarget = findProperty('javaVersion') ?: '7'

compileJava {
    sourceCompatibility = javaTarget
    targetCompatibility = javaTarget
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = "${rootProject.name}-java${javaTarget}.jar"
    manifest {
        attributes 'Main-Class': 'org.ifad.portal.httpsclienttest.HttpsClientTest'
    }
}